<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nara AI Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- ================= CHAT (kiri) ================= -->
    <section class="chat">
      <div class="chat-top">
        <label>Simulasi sebagai
          <select id="userSel"></select>
        </label>
        <label>Otak AI
          <select id="engineSel">
            <option value="auto">Auto</option>
            <option value="offline">Offline (aturan)</option>
            <option value="claude">Claude</option>
            <option value="n8n">n8n webhook</option>
          </select>
        </label>
      </div>
      <p class="scenario" id="scenario"></p>
      <header class="chat-head">
        <div class="avatar">N</div>
        <div>
          <div class="name">Nara · Customer Care</div>
          <div class="status" id="status">online</div>
        </div>
        <button class="ghost" id="resetBtn" title="Kembalikan database & percakapan ke awal">↺ Reset</button>
      </header>
      <div class="messages" id="messages"></div>
      <div class="chips" id="chips"></div>
      <form class="composer" id="composer">
        <input id="input" autocomplete="off" placeholder="Ketik pesan…" />
        <button type="submit" aria-label="Kirim">➤</button>
      </form>
    </section>

    <!-- ================= FLOW + DATA (kanan) ================= -->
    <section class="right">
      <div class="tabs">
        <span class="crumb">Personal · <b>AI AGENT CUSTOMER CARE</b></span>
        <div class="tabbar">
          <button class="tab active" data-tab="flow">Editor</button>
          <button class="tab" data-tab="db">Database</button>
        </div>
        <span class="mode" id="modeBadge">…</span>
      </div>
      <div class="pane" id="pane-flow">
        <div class="canvas-wrap" id="canvasWrap">
          <div class="canvas" id="canvas">
            <svg class="edges" id="edges"></svg>
          </div>
        </div>
        <div class="logs">
          <div class="logs-head">Logs eksekusi <span id="execInfo"></span></div>
          <ol id="logList"><li class="muted">Kirim pesan untuk melihat agent bekerja langkah demi langkah.</li></ol>
        </div>
      </div>
      <div class="pane hidden" id="pane-db"></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
